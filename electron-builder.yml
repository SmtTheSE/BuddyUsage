appId: com.buddyusage.app
productName: BuddyUsage
# Stable names so "releases/latest/download/<name>" links never change:
#   BuddyUsage-arm64.dmg / BuddyUsage-x64.dmg        (macOS)
#   BuddyUsage-x64.exe   / BuddyUsage-arm64.exe      (Windows installer)
#   BuddyUsage-x86_64.AppImage / BuddyUsage-arm64.AppImage (Linux)
artifactName: ${productName}-${arch}.${ext}
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: build/icon.png
  # Signing/notarization is driven entirely by environment:
  #   CSC_LINK + CSC_KEY_PASSWORD            → Developer ID .p12 (signs)
  #   APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD
  #     + APPLE_TEAM_ID                      → notarizes (zero Gatekeeper prompts)
  # With none of these set, build/afterPack.cjs ad-hoc signs so the bundle
  # at least has a valid seal (users get "Open Anyway" rather than "damaged").
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    LSUIElement: true
dmg:
  sign: false
  # The window explains the drag and the one-time "Open Anyway" step, so a
  # first-time user never has to leave the DMG to find out what to do.
  background: build/dmg-background.png
  iconSize: 128
  window:
    width: 660
    height: 400
  contents:
    - x: 190
      y: 165
      type: file
    - x: 470
      y: 165
      type: link
      path: /Applications
afterPack: build/afterPack.cjs

win:
  target:
    - target: nsis
      arch: [x64, arm64]
  icon: build/icon.png
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createDesktopShortcut: false
  deleteAppDataOnUninstall: false

linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
  icon: build/icon.png
  category: Development
  synopsis: Live plan usage for AI coding assistants

publish:
  provider: github
  owner: SmtTheSE
  repo: BuddyUsage
  releaseType: release
