name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build

      # electron-builder publishes the DMG/ZIP artifacts to the GitHub
      # Release matching the pushed tag (creating it if needed).
      - run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned build: no identity configured (see electron-builder.yml).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
