name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  # Build provenance: lets anyone verify an installer came from this repo's
  # workflow rather than someone's laptop (`gh attestation verify <file>`).
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            flag: --mac
          - os: windows-latest
            flag: --win
          - os: ubuntu-latest
            flag: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build

      # electron-builder publishes each platform's artifacts to the GitHub
      # Release matching the pushed tag (creating it if needed). All three
      # jobs append to the same release.
      #
      # Code signing is opt-in via repository secrets. When they're present
      # the macOS build is signed with a Developer ID and notarized (no
      # Gatekeeper prompt for users) and the Windows build is Authenticode
      # signed (no SmartScreen warning). Without them the macOS build is
      # ad-hoc signed by build/afterPack.cjs and Windows ships unsigned.
      # Export signing variables only when the secret is actually set: an
      # empty CSC_LINK makes electron-builder look for a certificate at ""
      # and abort, instead of falling back to the ad-hoc path.
      - name: Configure code signing from secrets
        shell: bash
        run: |
          any_cert=false
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; do
            value="${!name}"
            if [ -n "$value" ]; then
              echo "$name=$value" >> "$GITHUB_ENV"
              case "$name" in CSC_LINK|WIN_CSC_LINK) any_cert=true ;; esac
            fi
          done
          echo "CSC_IDENTITY_AUTO_DISCOVERY=$any_cert" >> "$GITHUB_ENV"
          echo "Code signing certificate configured: $any_cert"
        env:
          # macOS: base64 .p12 of a "Developer ID Application" certificate + its password
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # macOS notarization: Apple ID, an app-specific password, and the team ID
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows: base64 .pfx code-signing certificate + its password
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - run: npx electron-builder ${{ matrix.flag }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Plain-language install steps on the release page itself, so someone
      # who lands there from a link never needs the README or a terminal.
      - if: matrix.os == 'macos-14' && startsWith(github.ref, 'refs/tags/')
        run: gh release edit "${{ github.ref_name }}" --notes-file .github/release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish checksums and signed build provenance for every installer, so a
  # download can be verified even though the builds are not notarized.
  provenance:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Download release installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          gh release download "$TAG" --dir dist \
            --pattern '*.dmg' --pattern '*.exe' --pattern '*.AppImage' --pattern '*.zip'
          ls -la dist

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*'

      - name: Publish SHA-256 checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber

  # Keep the Homebrew cask in step with the release so
  # `brew install --cask buddyusage` always gets the newest
  # build with correct checksums. Uses the repo's own token — no extra secrets.
  update-cask:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Render cask from release checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" --pattern 'BuddyUsage-arm64.dmg' --pattern 'BuddyUsage-x64.dmg' --dir /tmp/dmg
          arm=$(sha256sum /tmp/dmg/BuddyUsage-arm64.dmg | cut -d' ' -f1)
          intel=$(sha256sum /tmp/dmg/BuddyUsage-x64.dmg | cut -d' ' -f1)
          scripts/render-cask.sh "${TAG#v}" "$arm" "$intel" > Casks/buddyusage.rb

      - name: Commit cask
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/buddyusage.rb
          git diff --cached --quiet || git commit -m "Update Homebrew cask to ${{ github.ref_name }}"
          git push origin main
