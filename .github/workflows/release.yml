name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            flag: --mac
          - os: windows-latest
            flag: --win
          - os: ubuntu-latest
            flag: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build

      # electron-builder publishes each platform's artifacts to the GitHub
      # Release matching the pushed tag (creating it if needed). All three
      # jobs append to the same release.
      #
      # Code signing is opt-in via repository secrets. When they're present
      # the macOS build is signed with a Developer ID and notarized (no
      # Gatekeeper prompt for users) and the Windows build is Authenticode
      # signed (no SmartScreen warning). Without them the macOS build is
      # ad-hoc signed by build/afterPack.cjs and Windows ships unsigned.
      - run: npx electron-builder ${{ matrix.flag }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS: base64 .p12 of a "Developer ID Application" certificate + its password
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
          # macOS notarization: Apple ID, an app-specific password, and the team ID
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows: base64 .pfx code-signing certificate + its password
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      # Plain-language install steps on the release page itself, so someone
      # who lands there from a link never needs the README or a terminal.
      - if: matrix.os == 'macos-14' && startsWith(github.ref, 'refs/tags/')
        run: gh release edit "${{ github.ref_name }}" --notes-file .github/release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
